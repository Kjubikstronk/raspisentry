<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Face Detections Dashboard</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(-45deg, #f8f9fa, #e0e7ff, #ffe0e7, #e0ffe7);
            background-size: 400% 400%;
            animation: gradientBG 8s ease-in-out infinite;
            min-height: 100vh;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .container {
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.5s ease-out 0.3s forwards;
        }
        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
        .card {
            border: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #e0e7ff;
            padding: 12px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #b80000;
            box-shadow: 0 0 0 0.2rem rgba(184, 0, 0, 0.25);
        }
        .btn-primary {
            background: #b80000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: #8b0000;
            transform: translateY(-2px);
        }
        .logo-animation {
            animation: logoPulse 1s ease-out;
        }
        @keyframes logoPulse {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .page-transition {
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .page-transition.fade-out {
            opacity: 0;
            transform: translateY(-20px);
        }
    </style>
</head>
<body>
    <div class="container py-4 page-transition">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" style="width:120px;" class="logo-animation">
                </div>
                <div class="card">
                    <div class="card-body">
                        <h2 class="text-center mb-4">Login</h2>
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-danger">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        <form method="POST" action="{{ url_for('login') }}">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required autocomplete="off">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            document.querySelector('.page-transition').classList.add('fade-out');
            setTimeout(() => {
                this.submit();
            }, 500);
        });
    </script>
</body>
</html>
