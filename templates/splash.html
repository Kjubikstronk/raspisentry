<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - RaspiSentry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Orbitron:700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(-45deg, #f8f9fa, #e0e7ff, #ffe0e7, #e0ffe7);
            background-size: 400% 400%;
            animation: gradientBG 8s ease-in-out infinite;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        .splash-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .logo-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.5rem;
            width: 100%;
            max-width: 300px;
        }
        .pulse-logo {
            width: 100%;
            max-width: 180px;
            height: auto;
            animation: pulse 1.2s cubic-bezier(.5,1.8,.5,1) 1;
            opacity: 0;
            animation-fill-mode: forwards;
            position: relative;
            z-index: 3;
        }
        .shadow {
            width: 100px;
            height: 20px;
            background: rgba(0,0,0,0.15);
            border-radius: 50%;
            margin-top: -20px;
            margin-bottom: 2rem;
            filter: blur(1px);
            opacity: 0;
            animation: shadow-fadein 1.2s 0.1s 1 forwards;
        }
        @keyframes pulse {
            0%   { transform: scale(0.7); opacity: 0; }
            40%  { transform: scale(1.15); opacity: 1; }
            60%  { transform: scale(0.95); opacity: 1; }
            80%  { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shadow-fadein {
            0%   { opacity: 0; }
            40%  { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .impact-title {
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            font-weight: bold;
            letter-spacing: 2px;
            color: #b80000;
            text-shadow: 0 2px 8px #fff, 0 4px 24px #b8000033;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadein 1.2s 0.5s both;
            font-family: 'Orbitron', Arial, sans-serif;
            text-align: center;
            padding: 0 1rem;
        }
        @keyframes fadein {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .loading-container {
            width: 100px;
            height: 100px;
            margin-top: 2rem;
        }
        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
    <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
</head>
<body>
    <div class="splash-container">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="pulse-logo">
        </div>
        <div class="shadow"></div>
        <div class="impact-title">Welcome to RaspiSentry</div>
        <div class="loading-container" id="lottie-container"></div>
    </div>

    <script>
        // Initialize Lottie animation
        const animation = lottie.loadAnimation({
            container: document.getElementById('lottie-container'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'https://assets2.lottiefiles.com/packages/lf20_p8bfn5to.json' // Loading animation
        });

        // Smooth transition to login page
        setTimeout(function() {
            document.body.classList.add('fade-out');
            setTimeout(function() {
                window.location.href = "{{ url_for('login') }}";
            }, 500);
        }, 3000); // Increased to 3 seconds for better experience
    </script>
</body>
</html>
