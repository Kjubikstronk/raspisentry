<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live View</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #232526 0%, #414345 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .liveview-card {
      background: rgba(255,255,255,0.95);
      border-radius: 18px;
      box-shadow: 0 8px 32px 0 rgba(31,38,135,0.37);
      padding: 2rem 2.5rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    .liveview-title {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #232526;
      letter-spacing: 1px;
    }
    .liveview-video {
      width: 100%;
      max-width: 520px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      margin-bottom: 1.5rem;
      background: #000;
      min-height: 320px;
      object-fit: cover;
    }
    .back-btn {
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="liveview-card mx-auto">
    <div class="liveview-title">
      <i class="bi bi-camera-video-fill me-2"></i>Live Camera View
    </div>
    <img src="{{ url_for('video_feed') }}" class="liveview-video" alt="Live View" id="liveview-img">
    <div>
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary back-btn">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
      </a>
    </div>
  </div>
</body>
</html>
